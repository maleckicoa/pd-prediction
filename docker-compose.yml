services:
  postgres:
    build:
      context: ./data-service
    #container_name: pd-postgres
    ports:
      - "5434:5432"
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc \"SELECT CASE WHEN to_regclass('public.train_feat_dist') IS NOT NULL AND EXISTS (SELECT 1 FROM train_feat_dist LIMIT 1) THEN 1 ELSE 0 END\" | grep -q 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - pgdata:/var/lib/postgresql/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5001:5000"
    environment:
      - GIT_PYTHON_REFRESH=quiet
    volumes:
      - mlflow_db:/mlflow
      - mlflow_artifacts:/artifacts
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --serve-artifacts
      - --backend-store-uri=sqlite:///mlflow/mlflow.db
      - --artifacts-destination=/artifacts
      - --allowed-hosts=*
    restart: unless-stopped

  train:
    image: pd-prediction-train:latest
    build:
      context: .
      dockerfile: train-service/Dockerfile.train
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      GIT_PYTHON_REFRESH: quiet
    volumes:
      - ./models:/app/models
      - ./train-service/src:/app/train-service/src
      - ./shared:/app/shared
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    profiles: ["train"]

  # Runs once before predict: trains LR1 if models/lr1_model.pkl is missing (empty or new models/ folder).
  train-init:
    image: pd-prediction-train:latest
    build:
      context: .
      dockerfile: train-service/Dockerfile.train
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      GIT_PYTHON_REFRESH: quiet
    volumes:
      - ./models:/app/models
      - ./train-service/src:/app/train-service/src
      - ./shared:/app/shared
      - ./.env:/app/.env:ro
      - ./train-init/ensure_lr1_model.sh:/app/train-init/ensure_lr1_model.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
    entrypoint: ["/bin/sh"]
    command: ["/app/train-init/ensure_lr1_model.sh"]
    restart: "no"

  fetch:
    build:
      context: .
      dockerfile: fetch-service/Dockerfile.fetch
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      FETCH_INTERVAL_SECONDS: 1
      RUN_SERVICE_URL: http://predict:8800/predict
    volumes:
      - ./fetch-service:/app/fetch-service
      - ./shared:/app/shared
      - ./.env:/app/.env:ro
    command: /app/fetch-service/main.py
    depends_on:
      postgres:
        condition: service_healthy
      predict:
        condition: service_started
    profiles: ["fetch"]

  predict:
    build:
      context: .
      dockerfile: predict-service/Dockerfile.predict
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # Default lr1 matches cold-start train-init. Set PREDICT_MODEL_NAMES (host or .env for compose) for multi-model.
      MODEL_NAME: ${MODEL_NAME:-lr1}
      MODEL_NAMES: ${PREDICT_MODEL_NAMES:-lr1}
    ports:
      - "8800:8800"
    volumes:
      - ./predict-service:/app/predict-service
      - ./shared:/app/shared
      - ./models:/app/models
      - ./.env:/app/.env:ro
    command: /app/predict-service/main.py
    depends_on:
      postgres:
        condition: service_healthy
      train-init:
        condition: service_completed_successfully
    profiles: ["fetch", "predict"]

volumes:
  pgdata:
    name: pd-prediction_pgdata
  mlflow_db:
    name: mlflow-service_mlflow_db
  mlflow_artifacts:
    name: mlflow-service_mlflow_artifacts


